<ion-header class="ion-no-border">
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ pageTitle }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-category">
  <div class="controls-bar">
    <button type="button" class="ctrl-btn" aria-label="Sort">
      <ion-icon name="swap-vertical-outline"></ion-icon>
    </button>
    <button type="button" class="ctrl-pill">vote <ion-icon name="chevron-down-outline"></ion-icon></button>
    <button type="button" class="ctrl-filter">
      <ion-icon name="funnel-outline"></ion-icon>
      Filter by <ion-icon name="caret-down-outline"></ion-icon>
    </button>
  </div>

  <div class="tag-row" *ngIf="!staticMode">
    <ion-item class="filter-item" lines="none">
      <ion-input
        [(ngModel)]="tagFilter"
        placeholder="Filter by tag"
        (keyup.enter)="applyFilter()"
      ></ion-input>
      <ion-button slot="end" size="small" (click)="applyFilter()">Apply</ion-button>
    </ion-item>
  </div>

  <!-- Static Graphic & Design proposals (mock) -->
  <div class="card-list" *ngIf="staticMode">
    <ion-card
      *ngFor="let p of staticProposals"
      class="gig-card"
      (click)="openProposal(p.id)"
    >
      <div class="card-row">
        <div class="thumb thumb--img">
          <img [src]="p.thumbnail" [alt]="p.title" />
        </div>
        <div class="card-main">
          <div class="card-top">
            <div class="title-block">
              <div class="rating">
                <ion-icon name="star" class="star"></ion-icon>
                <span>{{ p.rating }} ({{ p.ratingCount }})</span>
              </div>
              <h2>{{ p.title }}</h2>
            </div>
            <button
              type="button"
              class="heart-btn"
              [class.heart-btn--on]="isFavorite(p.id)"
              (click)="toggleFavorite($event, p.id)"
              aria-label="Favorite"
            >
              <ion-icon [name]="isFavorite(p.id) ? 'heart' : 'heart-outline'"></ion-icon>
            </button>
          </div>
          <p class="desc">{{ p.shortDescription }}</p>
          <div class="card-bottom">
            <span class="price">From <strong>{{ p.price }} DT</strong></span>
          </div>
        </div>
      </div>
    </ion-card>
  </div>

  <div class="pad" *ngIf="!staticMode && loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="card-list" *ngIf="!staticMode && !loading">
    <ion-card *ngFor="let g of gigs" class="gig-card" (click)="openGig(g._id)">
      <div class="card-row">
        <div class="thumb"></div>
        <div class="card-main">
          <div class="card-top">
            <div class="title-block">
              <h2>{{ g.title }}</h2>
              <div class="rating">
                <ion-icon name="star" class="star"></ion-icon>
                <span>4.9</span>
              </div>
            </div>
            <button type="button" class="heart-btn" (click)="$event.stopPropagation()">
              <ion-icon name="heart-outline"></ion-icon>
            </button>
          </div>
          <p class="desc">{{ g.description }}</p>
          <div class="card-bottom">
            <span class="price">From <strong>{{ g.price | number : '1.0-0' }} DT</strong></span>
          </div>
        </div>
      </div>
    </ion-card>
  </div>

  <div class="empty" *ngIf="!staticMode && !loading && gigs.length === 0">
    <p>No gigs in this category yet.</p>
  </div>
</ion-content>
