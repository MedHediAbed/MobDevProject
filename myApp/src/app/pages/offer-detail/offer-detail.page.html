<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/offers" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Offer detail</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-dark">
  <div class="pad" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div class="wrap" *ngIf="!loading && offer">
    <h1>{{ offer.titre }}</h1>
    <p class="description">{{ offer.description }}</p>

    <div class="stats">
      <div class="stat">
        <span class="label">Budget</span>
        <strong>{{ offer.budget | number : '1.0-2' }} DT</strong>
      </div>
      <div class="stat">
        <span class="label">Delay</span>
        <strong>{{ offer.delai }} days</strong>
      </div>
    </div>

    <ion-button *ngIf="canSubmitProposal" expand="block" color="dark" [routerLink]="['/submit-proposal', offer._id]">
      Submit proposal
    </ion-button>
  </div>
</ion-content>
