<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Freelancers</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="page-dark">
  <div class="pad" *ngIf="loading">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!loading" lines="none" class="dark-list">
    <ion-item
      *ngFor="let f of freelancers"
      button
      [routerLink]="['/freelancers', f._id]"
      detail="true"
      class="dark-item"
    >
      <ion-label>
        <h2>{{ f.name || 'Freelancer' }}</h2>
        <p>{{ f.email }}</p>
        <p class="bio-preview">{{ f.bio || 'No bio yet.' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="empty" *ngIf="!loading && freelancers.length === 0">
    <p>No approved freelancers yet.</p>
  </div>
</ion-content>
